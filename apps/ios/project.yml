name: OpenCodex
options:
  bundleIdPrefix: com.kmkoushik
  deploymentTarget:
    iOS: '26.0'
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    TARGETED_DEVICE_FAMILY: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  Markdown:
    url: https://github.com/swiftlang/swift-markdown
    from: '0.6.0'
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    # 1.x only: the 1.99 tags are 2.0 previews with a different API.
    minorVersion: '1.20.0'
targets:
  OpenCodex:
    type: application
    platform: iOS
    sources:
      - path: OpenCodex
      # The Live Activity's attributes, shared with the widget extension.
      - path: OpenCodexActivity/ReplyActivityAttributes.swift
    dependencies:
      - package: Markdown
      - package: SwiftTerm
      - target: OpenCodexActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kmkoushik.opencodex
        INFOPLIST_FILE: OpenCodex/Info.plist
        # Push notifications (APNs). The Live Activity needs no App Group: ActivityKit hands the
        # extension its attributes and state.
        CODE_SIGN_ENTITLEMENTS: Config/OpenCodex.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
  OpenCodexActivity:
    # The running-reply Live Activity (WidgetKit). Its bundle ID sits under the app's, so
    # automatic signing with the app's team covers it.
    type: app-extension
    platform: iOS
    sources:
      - path: OpenCodexActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kmkoushik.opencodex.activity
        INFOPLIST_FILE: OpenCodexActivity/Info.plist
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  OpenCodexTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OpenCodexTests
        excludes:
          - Fixtures
      - path: OpenCodexTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: OpenCodex
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  OpenCodexUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OpenCodexUITests
    dependencies:
      - target: OpenCodex
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OpenCodex
schemes:
  OpenCodex:
    build:
      targets:
        OpenCodex: all
    test:
      targets:
        - OpenCodexTests
        - OpenCodexUITests
