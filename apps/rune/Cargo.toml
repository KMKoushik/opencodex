[workspace]
resolver = "3"
members = [".", "crates/oc-gateway", "crates/oc-terminal", "crates/oc-webview", "crates/oc-markdown", "crates/oc-native"]

[package]
name = "opencodex"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "7286a3c5fe525bcbdb5a1188a4046ff4eff5f0de", features = ["tooling", "native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "7286a3c5fe525bcbdb5a1188a4046ff4eff5f0de", default-features = false, features = ["markdown"] }
oc-gateway = { path = "crates/oc-gateway" }
oc-terminal = { path = "crates/oc-terminal" }
oc-webview = { path = "crates/oc-webview" }
oc-markdown = { path = "crates/oc-markdown" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "7286a3c5fe525bcbdb5a1188a4046ff4eff5f0de" }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rune-notify = { git = "https://github.com/anomalyco/rune", rev = "7286a3c5fe525bcbdb5a1188a4046ff4eff5f0de" }
qrcode = { version = "0.14", default-features = false }
tokio = { version = "1", features = ["rt", "time", "sync"] }
base64 = "0.22"
regress = "0.12"
oc-native = { path = "crates/oc-native" }
chrono = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
sha2 = "0.10"
tempfile = "3"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "7286a3c5fe525bcbdb5a1188a4046ff4eff5f0de" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "7286a3c5fe525bcbdb5a1188a4046ff4eff5f0de" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "7286a3c5fe525bcbdb5a1188a4046ff4eff5f0de" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "7286a3c5fe525bcbdb5a1188a4046ff4eff5f0de" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "7286a3c5fe525bcbdb5a1188a4046ff4eff5f0de" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "7286a3c5fe525bcbdb5a1188a4046ff4eff5f0de" }

[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false
[profile.release]
codegen-units = 16
incremental = true
[profile.perf]
inherits = "release"
incremental = false
debug = false
