[package]
name = "oc-markdown"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[features]
default = ["markdown"]
markdown = []

# The copied guards are recognized, not exposed as nonfunctional crate features.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("math", "mermaid"))'] }

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "7286a3c5fe525bcbdb5a1188a4046ff4eff5f0de" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "7286a3c5fe525bcbdb5a1188a4046ff4eff5f0de", default-features = false, features = ["markdown"] }
pulldown-cmark = "0.13"
html5ever = "0.35"
markup5ever_rcdom = "0.35"
serde_json = "1"
parley = "0.12"

[dev-dependencies]
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "7286a3c5fe525bcbdb5a1188a4046ff4eff5f0de" }
