appId: dev.opencodex.app
productName: OpenCodex
artifactName: ${productName}-${version}-${arch}.${ext}
directories:
  output: release
files:
  - out/**
  - package.json
asar: true
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: build/icon.icns
  # Used when a Developer ID certificate is configured; unsigned builds skip signing.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  title: ${productName} ${version}
win:
  target: nsis
  icon: build/icon.ico
linux:
  target: AppImage
  icon: build/icon.png
