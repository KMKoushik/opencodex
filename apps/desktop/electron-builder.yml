appId: dev.opencodex.app
productName: OpenCodex
artifactName: ${productName}-${version}-${arch}.${ext}
directories:
  output: release
files:
  - out/**
  - package.json
asar: true
publish:
  provider: github
  owner: KMKoushik
  repo: opencodex
  releaseType: release
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  icon: build/icon.icns
  sign: apps/desktop/scripts/sign-mac.mjs
  # Self-signed releases use the same identity forever; Developer ID remains an optional upgrade.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  title: ${productName} ${version}
win:
  target: nsis
  icon: build/icon.ico
linux:
  target: AppImage
  icon: build/icon.png
