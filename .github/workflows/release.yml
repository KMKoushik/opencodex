name: Release desktop

# Push a tag like v0.2.0 to publish installers and update metadata to a GitHub Release.
# Run manually to build DMGs as a workflow artifact without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    name: macOS DMG (arm64 + x64)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(node -p "require('./apps/desktop/package.json').version")-dev.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$version'. Tags must look like v1.2.3 or v1.2.3-beta.1."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          [[ "$version" == *-* ]] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"

      - name: Typecheck and test
        run: |
          bun run typecheck
          bun run test

      - name: Import self-signed identity
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: bash scripts/import-signing-identity.sh

      - name: Verify native self-signed update installation
        run: node scripts/smoke-self-signed-update.mjs

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          args=(--mac --publish never "-c.extraMetadata.version=$VERSION")
          args+=("-c.forceCodeSigning=true" "-c.mac.identity=$CSC_NAME")
          if [[ "$OPENCODEX_SELF_SIGNED" == true ]]; then
            echo "Signing with the stable self-signed identity (not notarized)."
            unset APPLE_API_KEY_ID APPLE_API_ISSUER
          else
            if [[ -n "$APPLE_API_KEY_CONTENT" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" ]]; then
              echo "Notarizing with the App Store Connect API key."
              key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
              printf '%s' "$APPLE_API_KEY_CONTENT" > "$key"
              export APPLE_API_KEY="$key"
            else
              unset APPLE_API_KEY_ID APPLE_API_ISSUER
            fi
          fi
          unset APPLE_API_KEY_CONTENT
          bun run --cwd apps/desktop package "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenCodex-${{ steps.version.outputs.version }}-mac
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: OpenCodex ${{ steps.version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/latest-mac.yml
            apps/desktop/release/*.blockmap
